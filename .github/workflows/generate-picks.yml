name: Generate Daily Picks

# Folded in from the former Betbot- repo's daily-picks.yml as part of the
# betting-model / Betbot- merge (see MERGE_NOTES.md).
#
# Generates data/picks.json each day and commits it to main.
#
# NOTE: Set ODDS_API_KEY as a repo secret (Settings -> Secrets and variables ->
# Actions, or `gh secret set ODDS_API_KEY`) for real market data. Without it the
# runner writes a {"status": "no_data"} picks.json and still exits 0.
#
# Publishing: this workflow only updates data/picks.json in THIS repo. It does
# NOT redeploy any GitHub Pages site — the former Betbot- repo still owns Pages
# hosting for now. See MERGE_NOTES.md "Still pending" for the hosting decision.

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r models/mlb/requirements.txt

      - name: Generate daily picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python models/mlb/daily_runner.py

      - name: Commit picks.json if changed
        run: |
          if [ -n "$(git status --porcelain data/picks.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/picks.json
            git commit -m "chore: update daily picks.json"
            git push
          else
            echo "No change to data/picks.json — nothing to commit."
          fi
